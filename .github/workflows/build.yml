name: Build NerithMc GhostHit Plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: NerithMc-GhostHit-Plugins
          path: |
            monitor/build/libs/NerithMc-HitMonitor.jar
            verifier/build/libs/NerithMc-HitVerifier.jar
